[package]
name = "woodpecker-ci-mcp"
version = "0.2.0"
edition = "2024"
description = "MCP server for Woodpecker CI integration"
license = "MIT"

[dependencies]
# MCP SDK
rmcp = { version = "1.3", features = ["server", "transport-io", "macros"] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "query"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JSON Schema generation
schemars = "1.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64 decoding
base64 = "0.22"
