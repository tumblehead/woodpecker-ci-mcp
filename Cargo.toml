[package]
name = "woodpecker-ci-mcp"
version = "0.3.0"
edition = "2024"
description = "MCP server for Woodpecker CI integration"
license = "MIT"
rust-version = "1.88"

[dependencies]
# MCP SDK
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }

# Async runtime
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "query"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Log decoding and URL path encoding
base64 = "0.23"
percent-encoding = "2"

[profile.release]
lto = "thin"
strip = true
