when:
  - event: tag
    ref: "refs/tags/v*"

depends_on:
  - check

labels:
  platform: windows/amd64

skip_clone: true

steps:
  - name: build
    image: powershell
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      # Manual clone
      - git init
      - git remote add origin $env:CI_REPO_CLONE_URL
      - git fetch --no-tags --depth=1 origin $env:CI_COMMIT_SHA
      - git reset --hard $env:CI_COMMIT_SHA
      # Ensure cargo/rustup are in PATH (agent runs as SYSTEM)
      - $env:PATH = "$env:USERPROFILE\.cargo\bin;C:\Users\Administrator\.cargo\bin;$env:PATH"
      - rustup default stable
      - cargo build --release
      # Upload to Gitea release
      - >-
        $VERSION = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line -replace '.*"(.*)".*','$1';
        $ARTIFACT = "woodpecker-ci-mcp-v$VERSION-windows-x86_64.exe";
        New-Item -ItemType Directory -Force -Path artifacts;
        Copy-Item target\release\woodpecker-ci-mcp.exe "artifacts\$ARTIFACT";
        $headers = @{ "Authorization" = "token $env:GITEA_TOKEN" };
        try { Invoke-RestMethod -Method Post -Uri "$env:CI_FORGE_URL/api/v1/repos/$env:CI_REPO/releases" -Headers ($headers + @{ "Content-Type" = "application/json" }) -Body "{`"tag_name`":`"$env:CI_COMMIT_TAG`",`"name`":`"$env:CI_COMMIT_TAG`"}" } catch {};
        $release = Invoke-RestMethod -Uri "$env:CI_FORGE_URL/api/v1/repos/$env:CI_REPO/releases/tags/$env:CI_COMMIT_TAG" -Headers $headers;
        Invoke-RestMethod -Method Post -Uri "$env:CI_FORGE_URL/api/v1/repos/$env:CI_REPO/releases/$($release.id)/assets?name=$ARTIFACT" -Headers $headers -InFile "artifacts\$ARTIFACT" -ContentType "application/octet-stream"
