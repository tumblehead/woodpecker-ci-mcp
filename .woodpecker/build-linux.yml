when:
  - event: tag
    ref: "refs/tags/v*"

depends_on:
  - check

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: build
    image: bash
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      # Manual clone
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      - rustup default stable
      - cargo build --locked --release
      # Upload to Gitea release
      - >-
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/') &&
        ARTIFACT="woodpecker-ci-mcp-v$VERSION-linux-x86_64" &&
        mkdir -p artifacts &&
        cp target/release/woodpecker-ci-mcp artifacts/$ARTIFACT &&
        bash scripts/upload-release-asset.sh artifacts/$ARTIFACT
