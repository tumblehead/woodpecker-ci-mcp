when:
  - event: [push, pull_request, tag]

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: check
    image: bash
    commands:
      # Manual clone (plugin-git step env lacks full PATH for build tools)
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      - rustup default stable
      - cargo clippy --all-targets -- -D warnings
      - cargo test
