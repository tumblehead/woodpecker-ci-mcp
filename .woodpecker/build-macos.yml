when:
  - event: tag
    ref: "refs/tags/v*"

depends_on:
  - check

labels:
  platform: darwin/arm64

skip_clone: true

steps:
  - name: build
    image: bash
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      # Manual clone
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      - rustup default stable
      - rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - cargo build --locked --release --target x86_64-apple-darwin
      - cargo build --locked --release --target aarch64-apple-darwin
      # Upload to Gitea release
      - >-
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/') &&
        ARTIFACT="woodpecker-ci-mcp-v$VERSION-darwin-universal" &&
        mkdir -p artifacts &&
        lipo -create -output artifacts/$ARTIFACT
        target/x86_64-apple-darwin/release/woodpecker-ci-mcp
        target/aarch64-apple-darwin/release/woodpecker-ci-mcp &&
        bash scripts/upload-release-asset.sh artifacts/$ARTIFACT
